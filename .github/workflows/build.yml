name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build the engine on every push / PR and upload the exe as an artifact.
  # ---------------------------------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Release x64)
        run: cmake --build build --config Release

      - name: Upload RetroWall.exe
        uses: actions/upload-artifact@v4
        with:
          name: RetroWall
          path: build/Release/RetroWall.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # On a version tag (e.g. v1.0.0): build, package the installer, and publish
  # a GitHub Release with both the installer and the raw exe attached.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Release x64)
        run: cmake --build build --config Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RetroWall.iss'

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            installer/RetroWallSetup.exe
            build/Release/RetroWall.exe
